# Skopiuj do config.toml (jest w .gitignore, nie trafi do repo) i ustaw: chmod 600 config.toml
# ID miasta i usługi znajdziesz przez: luxmed_watch.py discover ...

interval_minutes = 5   # nie schodź poniżej ~3 min, żeby nie obciążać portalu
horizon_days = 60

[auth]
login = ""
password = ""

# Opcjonalnie: powiadomienia na telefon. Uzupełnij, potem: python luxmed_watch.py telegram
[telegram]
bot_token = ""
chat_id = ""

# Rezerwacja jednym kliknięciem: powiadomienie na Telegramie dostaje przycisk "Zarezerwuj".
# Domyślnie wyłączona. Wymaga skonfigurowanego [telegram].
[booking]
enabled = false

# W każdym bloku [[watch]] można dodać: enabled = false (wyłącza blok bez kasowania), true (włącza).
[[watch]]
label = "Stomatolog"
city_id = 1
city_name = "Warszawa"
service_id = 0          # wstaw ID z `discover services stomat`
doctors = []            # puste = dowolny lekarz; np. ["Kowalski", "Anna Nowak"]
clinic_ids = []         # puste = dowolna placówka

[[watch]]
label = "Dermatolog"
city_id = 1
city_name = "Warszawa"
service_id = 0          # `discover services dermat`
doctors = ["Nowak"]
# Opcjonalne filtry (wszystkie włącznie): godzina rozpoczęcia i dni tygodnia
# hours_from = "16:00"
# hours_to = "21:00"
# days = ["pon", "wt", "śr", "czw", "pt"]   # pon, wt, śr, czw, pt, sob, ndz
